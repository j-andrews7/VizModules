url: https://j-andrews7.github.io/VizModules/
template:
  bootstrap: 5
  light-switch: true
development:
  mode: auto

reference:
  - title: "ScatterPlot Module"
    desc: "dittoViz-based interactive scatter plot module."
    contents:
      - dittoViz_scatterPlotApp
      - dittoViz_scatterPlotInputsUI
      - dittoViz_scatterPlotOutputUI
      - dittoViz_scatterPlotServer

  - title: "yPlot Module"
    desc: "dittoViz-based Y-axis plot module (box, violin, ridgeplot, etc.)."
    contents:
      - dittoViz_yPlotApp
      - dittoViz_yPlotInputsUI
      - dittoViz_yPlotOutputUI
      - dittoViz_yPlotServer

  - title: "freqPlot Module"
    desc: "dittoViz-based composition/frequency plot module (per-sample frequencies by group)."
    contents:
      - dittoViz_freqPlotApp
      - dittoViz_freqPlotInputsUI
      - dittoViz_freqPlotOutputUI
      - dittoViz_freqPlotServer

  - title: "linePlot Module"
    desc: "Interactive line plot module."
    contents:
      - linePlot
      - linePlotApp
      - linePlotInputsUI
      - linePlotOutputUI
      - linePlotServer

  - title: "dumbbellPlot Module"
    desc: "Interactive dumbbell plot module."
    contents:
      - dumbbellPlot
      - dumbbellPlotApp
      - dumbbellPlotInputsUI
      - dumbbellPlotOutputUI
      - dumbbellPlotServer

  - title: "piePlot Module"
    desc: "Interactive pie/donut chart module."
    contents:
      - piePlot
      - piePlotApp
      - piePlotInputsUI
      - piePlotOutputUI
      - piePlotServer

  - title: "radarPlot Module"
    desc: "Interactive radar/spider chart module."
    contents:
      - radarPlot
      - radarPlotApp
      - radarPlotInputsUI
      - radarPlotOutputUI
      - radarPlotServer

  - title: "parallelCoordinatesPlot Module"
    desc: "Interactive parallel coordinates plot module."
    contents:
      - parallelCoordinatesPlot
      - parallelCoordinatesPlotApp
      - parallelCoordinatesPlotInputsUI
      - parallelCoordinatesPlotOutputUI
      - parallelCoordinatesPlotServer

  - title: "AreaPlot Module"
    desc: "plotthis-based interactive area plot module."
    contents:
      - plotthis_AreaPlotApp
      - plotthis_AreaPlotInputsUI
      - plotthis_AreaPlotOutputUI
      - plotthis_AreaPlotServer

  - title: "BarPlot Module"
    desc: "plotthis-based interactive bar plot module."
    contents:
      - plotthis_BarPlotApp
      - plotthis_BarPlotInputsUI
      - plotthis_BarPlotOutputUI
      - plotthis_BarPlotServer

  - title: "SplitBarPlot Module"
    desc: "plotthis-based interactive split/stacked bar plot module."
    contents:
      - plotthis_SplitBarPlotApp
      - plotthis_SplitBarPlotInputsUI
      - plotthis_SplitBarPlotOutputUI
      - plotthis_SplitBarPlotServer

  - title: "BoxPlot Module"
    desc: "plotthis-based interactive box plot module."
    contents:
      - plotthis_BoxPlotApp
      - plotthis_BoxPlotInputsUI
      - plotthis_BoxPlotOutputUI
      - plotthis_BoxPlotServer

  - title: "DensityPlot Module"
    desc: "plotthis-based interactive density plot module."
    contents:
      - plotthis_DensityPlotApp
      - plotthis_DensityPlotInputsUI
      - plotthis_DensityPlotOutputUI
      - plotthis_DensityPlotServer

  - title: "DotPlot Module"
    desc: "plotthis-based interactive dot plot module."
    contents:
      - plotthis_DotPlotApp
      - plotthis_DotPlotInputsUI
      - plotthis_DotPlotOutputUI
      - plotthis_DotPlotServer

  - title: "Histogram Module"
    desc: "plotthis-based interactive histogram module."
    contents:
      - plotthis_HistogramApp
      - plotthis_HistogramInputsUI
      - plotthis_HistogramOutputUI
      - plotthis_HistogramServer

  - title: "Heatmap Module"
    desc: "ComplexHeatmap-based interactive heatmap module."
    contents:
      - ComplexHeatmap_HeatmapApp
      - ComplexHeatmap_HeatmapInputsUI
      - ComplexHeatmap_HeatmapOutputUI
      - ComplexHeatmap_HeatmapStaticOutputUI
      - ComplexHeatmap_HeatmapServer
      - ComplexHeatmap_HeatmapMainOutputUI
      - ComplexHeatmap_HeatmapSubOutputUI
      - ComplexHeatmap_HeatmapInfoOutputUI

  - title: "dataFilter Module"
    desc: "Reusable data filtering module for use with plot modules."
    contents:
      - dataFilterServer
      - dataFilterUI
      - resolve_column_targets

  - title: "Module Gallery & Figure Builder"
    desc: "The gallery of every module on its example data, and the multi-panel figure builder module."
    contents:
      - moduleGalleryApp
      - figureBuilderApp
      - figureBuilderServer
      - figureBuilderUI

  - title: "Custom Inputs & Widgets"
    desc: "Reusable custom Shiny inputs for use in module UIs."
    contents:
      - multiColorPicker
      - multiDynamicInput
      - updateMultiColorPicker
      - updateMultiDynamicInput

  - title: "UI Helpers"
    desc: >
      Utility functions for building and organising module UIs, and the
      server-side stores that keep a module's own controls from costing an
      extra render.
    contents:
      - createModuleApp
      - empty_plot
      - facet_check
      - hide_input
      - main_title_input_ids
      - module_tack_ui
      - na_to_null
      - organize_inputs
      - require_data_frame
      - reset_manual_edits
      - setup_auto_update_logic
      - setup_axis_range
      - setup_reactive_defaults
      - show_input
      - toggle_facet_title_inputs
      - toggle_input_cell
      - use_vizmodules_skills
      - viz_select_input
      - update_viz_select

  - title: "Uniform UI Inputs"
    desc: "Standardised input builders and reset functions shared across modules."
    contents:
      - uniform_axes_inputs_ui
      - uniform_legend_inputs_ui
      - uniform_lines_inputs_ui
      - uniform_plotly_inputs_ui
      - uniform_stats_inputs_ui
      - uniform_subplot_spacing_inputs_ui
      - subplot_spacing_defaults
      - uniform_annotation_inputs_ui
      - reset_annotation_inputs
      - reset_axes_inputs
      - reset_legend_inputs
      - reset_lines_inputs
      - reset_plotly_inputs
      - reset_stats_inputs
      - get_default

  - title: "Facet & Subplot Utilities"
    desc: "Functions for faceted/multi-panel subplot layout and styling."
    contents:
      - apply_facet_subplot_spacing
      - build_facet_annotations
      - build_facet_panel_borders
      - clean_facet_dim
      - resolve_facet_layout
      - resolve_facet_sharing

  - title: "Axes, Layout & Plotly Config"
    desc: "Functions for axis styling, layout, reference lines, and plotly configuration."
    contents:
      - add_ablines
      - add_hlines
      - add_plot_config
      - add_reference_lines
      - add_vlines
      - adjusted_axis_label
      - apply_axis_title_to_annotations
      - reset_axis_title_text
      - apply_legend_styling
      - apply_legend_inputs
      - add_size_legend
      - apply_plotly_newshape
      - apply_render_margins
      - apply_subplot_axis_styling
      - apply_title_layout
      - axis_titles_as_annotations
      - create_axis_styles
      - create_ggplot_axis_style
      - linetype_to_dash
      - recycle_line_style
      - string_to_linetypes
      - heatmap_fit_width

  - title: "Point Highlighting & Labels"
    desc: "Helpers for highlighting and labelling individual points, for modules that adopt uniform_annotation_inputs_ui()."
    contents:
      - apply_highlight_styling
      - create_highlight_annotations
      - create_selected_annotations
      - merge_annotation_sets
      - parse_highlight_values

  - title: "Manual Plot Edits"
    desc: "Functions for applying user-drawn shapes and annotations to plotly figures."
    contents:
      - finalize_manual_edits
      - setup_manual_edits

  - title: "Model Backends"
    desc: "Pluggable model fitting registry for custom model line overlays. Register new backends to support any modelling package (drc, mgcv, brms, etc.)."
    contents:
      - build_model_row_spec
      - get_model_backend
      - list_model_backends
      - register_model_backend

  - title: "Statistical Utilities"
    desc: "Functions for computing and displaying pairwise statistical test annotations."
    contents:
      - apply_stat_annotations
      - compute_pairwise_stats
      - default_stat_pairs
      - create_stat_annotations
      - generate_pair_strings
      - note_brackets_skipped
      - parse_pair_strings
      - stat_bracket_headroom
      - stat_bracket_y_max

  - title: "Palette & Color Utilities"
    desc: "Functions for managing color palettes."
    contents:
      - default_group_colors
      - default_palettes
      - flatten_palette_options
      - reset_group_colors
      - resolve_palette
      - setup_group_colors

  - title: "Export & Download Utilities"
    desc: >
      Functions for preparing plot and source data for download, and for
      rendering a plot that is not a plotly graph to a vector or raster image.
    contents:
      - collect_source_data
      - create_source_download_handler
      - draw_to_png
      - draw_to_svg

  - title: "Utility Functions"
    desc: "General-purpose helper functions for data handling and validation."
    contents:
      - adjust_column_values
      - adjusted_values
      - adjustment_fn
      - as_plotted
      - blank_to_null
      - error_bar_halfwidth
      - get_documentation
      - is_pure_type
      - nz_value
      - parse_numeric_list
      - safe_eval_filter
      - safe_resolve_adj_fxn
      - validate_expression
      - with_stable_seed

  - title: "Example Data"
    desc: "Built-in datasets for demos and testing."
    contents:
      - example_bar
      - example_composition
      - example_demographics
      - example_iris
      - example_markers
      - example_heatmap_matrix
      - example_heatmap_column_data
      - example_mtcars
      - example_population
      - example_rnaseq
      - example_sales
      - example_school_earnings
      - example_skills
